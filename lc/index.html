<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安装 LiveContainer</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 40px 24px; background: #f5f5f7; color: #1d1d1f; text-align: center; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { color: #666; font-size: 15px; line-height: 1.6; }
  .btn { display: block; margin: 32px auto; padding: 18px 0; width: 100%; max-width: 340px; background: #0071e3; color: #fff; font-size: 19px; font-weight: 600; border-radius: 14px; text-decoration: none; }
  .steps { text-align: left; max-width: 340px; margin: 0 auto; font-size: 14px; color: #444; line-height: 1.9; }
</style>
</head>
<body>
  <h1>LiveContainer</h1>
  <p>已用北航证书签好，点下面按钮直接安装</p>
  <a class="btn" href="itms-services://?action=download-manifest&url=https%3A%2F%2Fw280358839-netizen.github.io%2Fhello-muse%2Flc%2Fmanifest.plist">点我安装</a>
  <div class="steps">
    1. 点按钮后弹提示，点「安装」<br>
    2. 回桌面等图标出现<br>
    3. 设置 → 通用 → VPN与设备管理 → 信任 Beihang University<br>
    4. 回桌面打开 LiveContainer
  </div>
